<html>
    <head>
        <title> Registration Form</title>
    </head>

    <body>
        <h2>Student Registration Form</h2>
        <form>
            <table>
                <tr>
                    <td><label>Roll no.:</label></td>
                    <td><input type="text"/></td><br><br>
                </tr>

                <tr>
                    <td><label>Student name:</label></td>
                    <td><input type="text" placeholder="First Name"/> <input type="text" placeholder="Last Name"/> <br><br></td>
                </tr>

                <tr>
                    <td><label>Father's name:</label>
                    <td><input type="text"/><br><br></td>
                </tr>

                <tr>
                    <td><label>Date of birth:</label></td>
                    <td><input type="datetime" placeholder="Date" width="20%"/>  <input type="datetime" placeholder="Month"/>  <input type="datetime" placeholder="Year"/></td>
                    <td><label>(DD-MM-YYYY)</label><br><br></td>
                </tr>

            
                <tr>
                    <td><label>Mobile no.:</label></td>
                    <td><input type="text"/><br><br></td>
                </tr>

            
                <tr>
                    <td><label>Email id:</label></td>
                    <td><input type="email"/><br><br></td>
                </tr>

            
                <tr>
                    <td><label>Password:</label></td>
                    <td><input type="password"/><br><br></td>
                </tr>
            
            
                <tr>
                    <td><label>Gender:</label></td>
                    <td><input type="radio" name="gender"/><label>Male</label>
                    <input type="radio" name="gender"/><label>Female</label></td>
                </tr>
            
                <tr>
                    <td><label>Department:</label></td>
                    <td>
                        <input type="checkbox" name="dept"/><label>CSE</label>
                        <input type="checkbox" name="dept"/><label>IT</label>
                        <input type="checkbox" name="dept"/><label>ECE</label>
                        <input type="checkbox" name="dept"/><label>Civil</label>
                        <input type="checkbox" name="dept"/><label>Mech</label>
                    </td>
                </tr>

            
                <tr>
                    <td><label>Course</label></td>
                    <td>
                        <select>
                            <option>------------------ Select Current Course's ------------------------</option>
                            <option>Java</option>
                            <option>Python</option>
                            <option>Gen-AI</option>
                            <option>MERN</option>
                            <option>DA</option>
                        </select><br><br>
                    </td>
                </tr>

            
                <tr>
                    <td><label>Student Photo:</label></td>
                    <td><input type="file" /><br><br></td>
                </tr>
            
            
                <tr>
                    <td><label>City:</label></td>
                    <td><input type="text"/><br><br></td>
                </tr>

            
                <tr>
                    <td><label>Address:</label></td>
                    <td><textarea></textarea><br><br></td>
                </tr>

            
                <tr>
                    <td><button>Register</button></td>
                </tr>

            </table>


        </form>
    </body>
</html>
