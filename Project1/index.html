<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>

<body>

    <div class="container1">

        <h1>Registration Form</h1>
    <div>

    <div class="container2">
        <form onsubmit="register(event)">
            <h3>First Name:</h3>
            <input type="text" placeholder="Enter First Name" id="fname">
            <h3>Last Name:</h3>
            <input type="text" placeholder="Enter Last Name" id="lname">
            <h3>Email:</h3>
            <input type="email" placeholder="Enter email address" id="email">
            <h3>Password:</h3>
            <input type="password" placeholder="Enter password" id="password">
            <h3>Re-Type Password</h3>
            <input type="password" placeholder="confirm password" id="cPassword">
            <h3>Contact:</h3>
            <input type="number" placeholder="Enter contact number" id="number"><br><br>
            <input type="submit" value="Register">


        </form>


    </div>



    <script src="./script.js"></script>
</body>

</html>
